repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: (^|/)dist/
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
        exclude: (^|/)dist/
      - id: fix-encoding-pragma
      - id: mixed-line-ending
      - id: sort-simple-yaml
      - id: trailing-whitespace
        exclude: (^|/)dist/
      - id: fix-byte-order-marker

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # v0.23.3
    hooks:
      - id: markdownlint-cli2-docker

  - repo: local
    hooks:
      - id: build-gate-action
        name: Build GATE Action dist
        entry: bash -c "if [ ! -d github/shared-workflows/gate/node_modules ]; then npm --prefix github/shared-workflows/gate ci; fi && npm --prefix github/shared-workflows/gate test && npm --prefix github/shared-workflows/gate run package"
        language: system
        files: ^github/shared-workflows/gate/(src/|package\.json|package-lock\.json|tsconfig\.json)
        pass_filenames: false
