# Managed by Axon; manual edits will be overwritten.
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/github/shared-workflows/docker-image-build-publish"
      - "/github/shared-workflows/gate"
      - "/github/shared-workflows/goreleaser"
      - "/github/shared-workflows/pre-commit"
      - "/github/shared-workflows/setup-shellcheck"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain version for Docker
  - package-ecosystem: "docker"
    directory: "/github/shared-workflows/docker-image-build-publish"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      docker:
        patterns:
          - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directories:
      - "/github/shared-workflows/gate"
      - "/github/shared-workflows/gate/dist"
      - "/github/shared-workflows/gate/dist/post"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      npm:
        patterns:
          - "*"

  # Maintain dependencies for Python
  - package-ecosystem: "pip"
    directory: "/github/shared-workflows/pre-commit"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      python:
        patterns:
          - "*"

  # Maintain dependencies for pre-commit
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pre-commit:
        patterns:
          - "*"
