version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/github/shared-workflows/docker-image-build-publish"
      - "/github/shared-workflows/goreleaser"
      - "/github/shared-workflows/pre-commit"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pre-commit:
        patterns:
          - "*"

  # Maintain dependencies for the shared pre-commit workflow's Python requirements
  - package-ecosystem: "pip"
    directories:
      - "/github/shared-workflows/pre-commit"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pip:
        patterns:
          - "*"

  # Maintain npm dependencies for the shared gate action
  - package-ecosystem: "npm"
    directories:
      - "/github/shared-workflows/gate"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "23:30"
      timezone: "UTC"
    target-branch: "main"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      npm:
        patterns:
          - "*"
