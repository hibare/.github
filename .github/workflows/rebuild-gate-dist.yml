name: Rebuild Gate Dist

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "github/shared-workflows/gate/src/**"
      - "github/shared-workflows/gate/package.json"
      - "github/shared-workflows/gate/package-lock.json"
      - "github/shared-workflows/gate/tsconfig.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: github/shared-workflows/gate/package-lock.json

      - name: Install dependencies
        run: npm --prefix github/shared-workflows/gate ci

      - name: Test
        run: npm --prefix github/shared-workflows/gate test

      - name: Rebuild dist
        run: npm --prefix github/shared-workflows/gate run package

      - name: Commit rebuilt dist
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "chore: rebuild gate dist"
          file_pattern: github/shared-workflows/gate/dist/**
