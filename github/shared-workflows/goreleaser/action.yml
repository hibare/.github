name: Goreleaser build & Publish
description: Build and publish artifacts using Goreleaser

inputs:
  args:
    required: true
    description: Goreleaser args
  workdir:
    default: .
    description: Work directory
  sign:
    default: "false"
    description: Sign artifacts using cosign

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Cosign install
      if: ${{ github.event_name != 'pull_request' && inputs.sign == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: latest
        args: ${{ inputs.args }}
        workdir: ${{ inputs.workdir }}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        FURY_TOKEN: ${{ env.FURY_TOKEN }}
