name: Docker Build & Publish

description: Build and publish Docker images, optionally with BuildKit build secrets.

inputs:
  dockerfile:
    default: ./Dockerfile
    description: Path to Dockerfile

  context:
    default: .
    description: Path to context

  image_names:
    required: true
    description: Space separated list of image names.

  tags:
    required: true
    description: Space separated list of additional image tags.

  push_dockerhub:
    required: false
    default: "false"

  push_ghcr:
    required: false
    default: "false"

  build_args:
    required: false
    default: ""
    description: Space-separated list of build args.

  secrets:
    required: false
    default: ""
    description: |
      Newline-separated list of BuildKit build secrets in KEY=VALUE form.

  platforms:
    required: true
    description: Comma-separated list of platforms.

outputs:
  image_digest:
    description: The image digest
    value: ${{ steps.docker_build.outputs.digest }}

runs:
  using: composite

  steps:
    - name: Prechecks
      shell: bash
      run: |
        if [[ "${{ inputs.push_dockerhub }}" == "true" ]]; then
          if [[ -z "${{ env.DOCKERHUB_PASSWORD }}" ]]; then
            echo "DOCKERHUB_PASSWORD env is not set"
            exit 1
          fi

          if [[ -z "${{ env.DOCKERHUB_USERNAME }}" ]]; then
            echo "DOCKERHUB_USERNAME env is not set"
            exit 1
          fi
        fi

        if [[ "${{ inputs.push_ghcr }}" == "true" ]]; then
          if [[ -z "${{ env.GITHUB_TOKEN }}" ]]; then
            echo "GITHUB_TOKEN env is not set"
            exit 1
          fi
        fi

    - name: Build newline separated args
      id: newlined-input
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.setOutput('tags', `${{ inputs.tags }}`.split(" ").join("\n"))
          core.setOutput('image_names', `${{ inputs.image_names }}`.split(" ").join("\n"))
          core.setOutput('build_args', `${{ inputs.build_args }}`.split(" ").join("\n"))

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.newlined-input.outputs.image_names }}
        tags: ${{ steps.newlined-input.outputs.tags }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      with:
        platforms: all

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Login to DockerHub
      if: ${{ inputs.push_dockerhub == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_PASSWORD }}

    - name: Login to GitHub Container Registry
      if: ${{ inputs.push_ghcr == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ env.GITHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        file: ${{ inputs.dockerfile }}
        context: ${{ inputs.context }}
        builder: ${{ steps.buildx.outputs.name }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push_dockerhub == 'true' || inputs.push_ghcr == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}

        cache-from: type=gha,scope=docker-${{ inputs.image_names }}
        cache-to: type=gha,mode=max,scope=docker-${{ inputs.image_names }}

        build-args: ${{ steps.newlined-input.outputs.build_args }}
        secrets: ${{ inputs.secrets }}

    - name: Image digest
      shell: bash
      run: echo "${{ steps.docker_build.outputs.digest }}"
